<rect x="40" y="40" width="250" height="92" rx="10" fill="#1b2130" stroke="#f2d14e" stroke-width="1.5"/>
<text x="58" y="74" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#e8eaf0">AI / Contexts</text>
<text x="58" y="98" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9aa3b2">11 context packs: el arranque de</text>
<text x="58" y="116" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9aa3b2">cada entidad</text>
<rect x="330" y="40" width="250" height="92" rx="10" fill="#1b2130" stroke="#f2d14e" stroke-width="1.5"/>
<text x="348" y="74" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#e8eaf0">SYSTEM / ADR</text>
<text x="348" y="98" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9aa3b2">96 decisiones con fecha y motivo</text>
<rect x="620" y="40" width="250" height="92" rx="10" fill="#1b2130" stroke="#f2d14e" stroke-width="1.5"/>
<text x="638" y="74" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#e8eaf0">SYSTEM / Checkpoints</text>
<text x="638" y="98" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9aa3b2">72 traspasos entre sesiones</text>
<rect x="910" y="40" width="250" height="92" rx="10" fill="#161a22" stroke="#2a3040" stroke-width="1.5"/>
<text x="928" y="74" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#e8eaf0">MEMORY / Decisions</text>
<text x="928" y="98" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9aa3b2">decisiones vigentes y retiradas</text>
<rect x="40" y="180" width="250" height="92" rx="10" fill="#161a22" stroke="#2a3040" stroke-width="1.5"/>
<text x="58" y="214" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#e8eaf0">SYSTEM / Playbooks</text>
<text x="58" y="238" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9aa3b2">22 procedimientos ya pagados</text>
<rect x="330" y="180" width="250" height="92" rx="10" fill="#1b2130" stroke="#f2d14e" stroke-width="1.5"/>
<text x="348" y="214" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#e8eaf0">INBOX</text>
<text x="348" y="238" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9aa3b2">buzon entre agentes, una sesion a</text>
<text x="348" y="256" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9aa3b2">la vez</text>
<rect x="620" y="180" width="250" height="92" rx="10" fill="#161a22" stroke="#2a3040" stroke-width="1.5"/>
<text x="638" y="214" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#e8eaf0">BRANDS y VENTURES</text>
<text x="638" y="238" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9aa3b2">cada marca y cada producto, con su</text>
<text x="638" y="256" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9aa3b2">estado</text>
<rect x="910" y="180" width="250" height="92" rx="10" fill="#1b2130" stroke="#f2d14e" stroke-width="1.5"/>
<text x="928" y="214" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#e8eaf0">AUTOMATION</text>
<text x="928" y="238" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9aa3b2">verificador de 8 reglas y scripts</text>
<rect x="40" y="320" width="250" height="92" rx="10" fill="#161a22" stroke="#2a3040" stroke-width="1.5"/>
<text x="58" y="354" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#e8eaf0">AI_CONTRACT</text>
<text x="58" y="378" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9aa3b2">que puede y que no puede un agente</text>
<rect x="330" y="320" width="250" height="92" rx="10" fill="#161a22" stroke="#2a3040" stroke-width="1.5"/>
<text x="348" y="354" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#e8eaf0">ONTOLOGY</text>
<text x="348" y="378" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9aa3b2">que es una decision, un playbook,</text>
<text x="348" y="396" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9aa3b2">un estado</text>
<rect x="620" y="320" width="250" height="92" rx="10" fill="#161a22" stroke="#2a3040" stroke-width="1.5"/>
<text x="638" y="354" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#e8eaf0">CONSTITUTION</text>
<text x="638" y="378" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9aa3b2">las reglas del sistema, no las de</text>
<text x="638" y="396" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9aa3b2">cada proyecto</text>
<rect x="910" y="320" width="250" height="92" rx="10" fill="#161a22" stroke="#2a3040" stroke-width="1.5"/>
<text x="928" y="354" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#e8eaf0">ARCHIVE</text>
<text x="928" y="378" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9aa3b2">lo retirado se conserva, no se</text>
<text x="928" y="396" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9aa3b2">borra</text>
<text x="40" y="442" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9aa3b2">Amarillo: lo que se ejecuta o se consulta en cada sesión. Gris: lo que da contexto y memoria.</text>
</svg>
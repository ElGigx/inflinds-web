<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
<rect width="1200" height="430" fill="#0d0f14"/>
<text x="40" y="42" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#9aa3b2">MEDICIÓN</text>
<text x="330" y="42" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#9aa3b2">LO QUE ENCONTRÓ</text>
<text x="700" y="42" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#9aa3b2">LO QUE CAMBIÓ</text>
<line x1="40" y1="62" x2="1160" y2="62" stroke="#2a3040" stroke-width="1"/>
<text x="40" y="92" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#f2d14e">COUNT(*) en producción</text>
<text x="330" y="92" font-family="Inter, Arial, sans-serif" font-size="13" fill="#e8eaf0">43 productos, 3 pedidos, 0 leads</text>
<text x="700" y="92" font-family="Inter, Arial, sans-serif" font-size="13" fill="#7ee0a8">El sitio no era una tienda: era un escaparate</text>
<line x1="40" y1="140" x2="1160" y2="140" stroke="#2a3040" stroke-width="1"/>
<text x="40" y="170" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#f2d14e">Panel de hosting</text>
<text x="330" y="170" font-family="Inter, Arial, sans-serif" font-size="13" fill="#e8eaf0">El 87 % del disco son inodos</text>
<text x="700" y="170" font-family="Inter, Arial, sans-serif" font-size="13" fill="#7ee0a8">Se cayó el eje de precios que estaba propuesto</text>
<line x1="40" y1="218" x2="1160" y2="218" stroke="#2a3040" stroke-width="1"/>
<text x="40" y="248" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#f2d14e">Chat real de clientes</text>
<text x="330" y="248" font-family="Inter, Arial, sans-serif" font-size="13" fill="#e8eaf0">La acción del agente era inalcanzable</text>
<text x="700" y="248" font-family="Inter, Arial, sans-serif" font-size="13" fill="#7ee0a8">Solicitud con tipo y dueño, en dos canales</text>
<line x1="40" y1="296" x2="1160" y2="296" stroke="#2a3040" stroke-width="1"/>
<text x="40" y="326" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#f2d14e">El vocabulario del oficio</text>
<text x="330" y="326" font-family="Inter, Arial, sans-serif" font-size="13" fill="#e8eaf0">1" de tubo son 32 mm, no 25,4</text>
<text x="700" y="326" font-family="Inter, Arial, sans-serif" font-size="13" fill="#7ee0a8">El catálogo cambió de dato, no de etiqueta</text>
<line x1="40" y1="374" x2="1160" y2="374" stroke="#2a3040" stroke-width="1"/>
<text x="40" y="416" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9aa3b2">Medición de producto, no investigación con usuarios: el dato viene del sistema, no de una persona.</text>
</svg>